cases:
  - name: agent-preflight
    skill: node-agent-preflight
    prompt: "Establish a trustworthy baseline before changing a Node.js service whose branch, runtime, package manager, CI gates, and working tree state are currently unknown."
    pressure: ["existing conventions", "failure path", "security boundary", "resource limits"]
    routing_signals: ["working tree","branch baseline","package manager","runtime version","CI gate"]
    negative_signals: ["node-agent-change-safety","node-agent-evidence-gathering"]
    evidence: ["package/dependency configuration", "owning implementation", "focused tests", "failure-path behavior"]
    disambiguation: "Prove repository state before deciding what to edit."
    must_not_select: ["node-agent-change-safety","node-agent-evidence-gathering"]
    expected_invariants: ["explicit ownership", "bounded resources", "observable behavior", "tests prove the contract"]
  - name: agent-evidence-gathering
