    skill: node-filesystem-safety
    prompt: "Implement or review a production Node.js backend change involving filesystem safety."
    pressure: ["existing repository conventions", "failure path", "security boundary", "resource limits"]
    expected_invariants: ["explicit ownership", "bounded resources", "observable behavior", "tests prove the contract"]

