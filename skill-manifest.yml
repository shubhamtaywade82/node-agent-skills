# v3 cross-pack section (additive). Existing v1 parsers ignore this key.
# See docs/CROSS_PACK_SCHEMA.md for the full contract.
cross_pack:
  schema_version: 3
  companions:
    - pack: ruby-agent-skills
      repo: https://github.com/shubhamtaywade82/ruby-agent-skills
      pinned_ref: v1.5.0
      snapshot: data/cross-pack/ruby-agent-skills.snapshot.yml
      seam_skill: node-ruby-integration
      language: ruby
    - pack: react-agent-skills
      repo: https://github.com/shubhamtaywade82/react-agent-skills
      pinned_ref: main
      snapshot: data/cross-pack/react-agent-skills.snapshot.yml
      seam_skill: node-react-integration
      language: typescript
  # node-agent-skills and ruby-agent-skills share ZERO skill names today
  # (this pack prefixes every skill with `node-`). The registry below is
  # empty by design; cross_pack.name_collisions is the machine-checkable
  # surface that the v3 verifier compares against the actual set intersection.
  name_collisions: []
  seam_contracts:
    - boundary: node-to-ruby-backend
      primary_in_this_pack: node-ruby-integration
      secondary_in_this_pack:
        - node-rest-api-design
        - node-postgresql-persistence
        - node-runtime-validation
      companion_pack: ruby-agent-skills
      companion_side: ruby-agent-skills/skills/rails-node-integration
      routing_doc: router/ROUTING.md#node-and-ruby-cross-stack-routing
      eval_cases: evals/cases/api/rails-backend-seam.yml
    - boundary: node-to-react-client
      primary_in_this_pack: node-react-integration
      secondary_in_this_pack:
        - node-rest-api-design
        - node-runtime-validation
      companion_pack: react-agent-skills
      companion_side: react-agent-skills/skills/browser-authentication
      routing_doc: router/ROUTING.md#node-and-react-cross-stack-routing
      eval_cases: evals/cases/api/react-client-seam.yml
