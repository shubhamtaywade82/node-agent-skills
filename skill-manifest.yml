version: 1
pack:
  name: node-agent-skills
  language: TypeScript
  runtime: Node.js
skills:
  - name: node-architecture
    category: architecture
    triggers: [architecture, module boundary, dependency injection, modular monolith, ports and adapters]
  - name: node-design-patterns
    category: architecture
    triggers: [design pattern, Strategy, Adapter, Facade, Factory, Command, Chain of Responsibility, Observer, State, Decorator, Builder, refactoring, coupling, composition]
  - name: node-runtime-foundations
    category: runtime
    triggers: [event loop, ESM, CommonJS, package exports, process lifecycle, signals, startup, shutdown]
  - name: node-async-concurrency
    category: runtime
    triggers: [Promise, concurrency, cancellation, AbortController, timeout, race condition, bounded concurrency]
  - name: node-typescript-contracts
    category: typescript
    triggers: [TypeScript, strict, generics, discriminated union, tsconfig, public type]
  - name: node-runtime-validation
    category: boundary
    triggers: [JSON, runtime validation, schema, external input, environment variables, queue payload]
  - name: node-api-engineering
    category: api
    triggers: [HTTP, REST, OpenAPI, pagination, idempotency, API versioning]
  - name: node-auth-security
    category: security
    triggers: [authentication, authorization, JWT, OAuth, OIDC, tenant isolation, rate limiting, SSRF]
  - name: node-postgresql-persistence
    category: persistence
    triggers: [PostgreSQL, SQL, transaction, migration, index, locking, connection pool]
  - name: node-background-jobs-reliability
    category: reliability
    triggers: [queue, worker, job, retry, backoff, dead letter, outbox, idempotency]
  - name: node-observability
    category: operations
    triggers: [logging, metrics, tracing, OpenTelemetry, health check, audit]
  - name: node-testing
    category: testing
    triggers: [unit test, integration test, API test, contract test, Testcontainers, fuzzing]
  - name: node-performance
    category: performance
    triggers: [performance, profiling, memory, heap, event loop lag, backpressure, load]
  - name: node-production-runtime
    category: operations
    triggers: [production, graceful shutdown, readiness, liveness, Docker, Kubernetes]
  - name: node-external-integrations
    category: integrations
    triggers: [third-party API, HTTP client, webhook, timeout, retry, secret, external service]
  - name: node-http-engineering
    category: api
    triggers: [HTTP lifecycle, middleware, request context, response lifecycle, error handling]
  - name: node-api-versioning
    category: api
    triggers: [API versioning, compatibility, deprecation, migration, v1, v2]
  - name: node-rest-api-design
    category: api
    triggers: [REST, resource modeling, status code, error envelope, endpoint design]
  - name: node-pagination-filtering
    category: api
    triggers: [pagination, cursor, offset, filtering, sorting, list endpoint]
  - name: node-idempotency
    category: reliability
    triggers: [idempotency key, duplicate request, retry-safe mutation, replay]
  - name: node-openapi
    category: api
    triggers: [OpenAPI, Swagger, API schema, contract-first, schema drift]
  - name: node-graphql
    category: api
    triggers: [GraphQL, resolver, schema, query cost, DataLoader, subscriptions]
  - name: node-websockets
    category: api
    triggers: [WebSocket, WS, realtime, connection lifecycle, backpressure, reconnect]
  - name: node-webhooks
    category: integrations
    triggers: [webhook, signature, raw body, replay, duplicate delivery]

  - name: node-database-engineering
    category: persistence
    triggers: [database schema, SQL, constraints, indexes, tenant isolation, ORM]
  - name: node-transactions
    category: persistence
    triggers: [transaction, isolation, locking, rollback, deadlock]
  - name: node-migrations
    category: persistence
    triggers: [migration, schema change, expand contract, backfill, DDL]
  - name: node-connection-pooling
    category: persistence
    triggers: [connection pool, pool exhaustion, database connections, max connections]
  - name: node-redis
    category: infrastructure
    triggers: [Redis, node-redis, pipeline, transaction, Pub/Sub, client cache]
  - name: node-caching
    category: infrastructure
    triggers: [cache, cache-aside, TTL, invalidation, stampede, stale data]
  - name: node-queues
    category: reliability
    triggers: [queue, worker, background job, retry, dead letter, scheduling]
  - name: node-message-brokers
    category: distributed
    triggers: [Kafka, broker, topic, partition, consumer group, offset, replay]
  - name: node-outbox
    category: distributed
    triggers: [outbox, relay, event publication, durable event, replay]
  - name: node-transactional-outbox
    category: distributed
    triggers: [transactional outbox, dual write, atomic event, event relay]

  - name: node-retry-timeouts
    category: reliability
    triggers: [retry, timeout, deadline, backoff, jitter, cancellation]
  - name: node-resilience
    category: reliability
    triggers: [resilience, degraded mode, fallback, dependency failure, capacity]
  - name: node-circuit-breakers
    category: reliability
