    triggers: [contract testing, provider consumer, API compatibility, schema contract, integration contract]
  - name: node-property-testing
    category: testing
    triggers: [property based testing, invariants, generated inputs, shrinking, counterexample]
  - name: node-fuzz-testing
    category: testing
    triggers: [fuzzing, malformed input, parser fuzzing, crash detection, hang detection]
  - name: node-schema-evolution
    category: distributed
    triggers: [schema evolution, backward compatibility, mixed versions, event schema, field removal]
  - name: node-feature-flags
    category: release
    triggers: [feature flag, rollout, kill switch, tenant targeting, progressive delivery]
  - name: node-containerization
    category: production
    triggers: [Docker, container image, multi-stage, non-root, container signals]
  - name: node-kubernetes
    category: production
    triggers: [Kubernetes, probes, Deployment, resource limits, rolling update, termination]
  - name: node-serverless
    category: production
    triggers: [serverless, function handler, cold start, invocation retry, stateless function]

adapters:
  express:
    path: adapters/express/SKILL.md
    version_scope: 5.x
    source: https://expressjs.com/en/guide/migrating-5/
  fastify:
    path: adapters/fastify/SKILL.md
    version_scope: 5.x
    source: https://fastify.dev/docs/latest/Reference/Lifecycle/
  nestjs:
    path: adapters/nestjs/SKILL.md
    version_scope: 12.x
    source: https://docs.nestjs.com/migration-guide
  hono:
    path: adapters/hono/SKILL.md
    version_scope: 4.x
    source: https://hono.dev/docs/guides/middleware
  prisma:
    path: adapters/prisma/SKILL.md
    version_scope: 7.x/8.x
    source: https://www.prisma.io/docs/orm/release-status
  drizzle:
    path: adapters/drizzle/SKILL.md
    version_scope: current/v1
    source: https://orm.drizzle.team/docs/migrations
  bullmq:
    path: adapters/bullmq/SKILL.md
    version_scope: 5.x/6.x
    source: https://docs.bullmq.io/guide/queues/
  redis:
    path: adapters/redis/SKILL.md
    version_scope: node-redis-5.x
    source: https://redis.io/docs/latest/develop/clients/nodejs/
  npm:
    path: adapters/npm/SKILL.md
    version_scope: current npm CLI
    source: https://docs.npmjs.com/cli/
  docker:
    path: adapters/docker/SKILL.md
    version_scope: current Docker/BuildKit
    source: https://docs.docker.com/guides/nodejs/
  kubernetes:
    path: adapters/kubernetes/SKILL.md
    version_scope: current Kubernetes API conventions
    source: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
  opentelemetry:
    path: adapters/opentelemetry/SKILL.md
    version_scope: current OpenTelemetry JavaScript SDK
    source: https://opentelemetry.io/docs/languages/js/
  vitest:
    path: adapters/vitest/SKILL.md
    version_scope: current Vitest 5.x
    source: https://vitest.dev/guide/
  jest:
    path: adapters/jest/SKILL.md
    version_scope: 30.x
    source: https://jestjs.io/docs/getting-started
  testcontainers:
    path: adapters/testcontainers/SKILL.md
    version_scope: current Node.js Testcontainers
    source: https://testcontainers.com/guides/getting-started-with-testcontainers-for-nodejs/
  playwright:
    path: adapters/playwright/SKILL.md
    version_scope: current Playwright Test
    source: https://playwright.dev/docs/api-testing/
