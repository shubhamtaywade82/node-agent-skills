# v3 fix: previously this key was `adapters:` and was followed by BOTH a
# YAML sequence (112 skill-shaped entries) AND a YAML mapping (95 adapter
# metadata entries) under the same key. Standard YAML parsers reject this; the
# pack only loaded because the line-regex parsers in lib/skill-loader.mjs and
# scripts/validate.mjs match by line pattern, not by YAML section.
#
# v3 splits the two concerns into two top-level keys:
#   - `adapter_skills:` (sequence) — skill-shaped entries that were misplaced
#     under `adapters:`. Treated as ordinary skills by the line-regex parser.
#   - `adapters:` (mapping) — the real adapter metadata (path/version_scope/
#     source).
#
# Both the legacy line-regex parsers AND any v3-aware YAML parser (e.g. a
# future cross-pack loader using js-yaml) now see a structurally valid file.
# See docs/CROSS_PACK_SCHEMA.md for the v3 contract.
