    category: distributed
    triggers: [distributed system, partial failure, consistency, reconciliation]
  - name: node-distributed-locks
    category: distributed
    triggers: [distributed lock, lease, fencing, leader, coordination]
  - name: node-event-driven-architecture
    category: distributed
    triggers: [event-driven, domain event, integration event, event contract]
  - name: node-zero-downtime
    category: production
    triggers: [zero downtime, readiness, drain, rolling deploy, graceful shutdown]
  - name: node-database-migrations-production
    category: production
    triggers: [production migration, online DDL, expand contract, backfill, schema rollout]
  - name: node-incident-engineering
    category: operations
    triggers: [incident, outage, mitigation, root cause, blast radius, runbook]
  - name: node-runtime-diagnostics
    category: operations
    triggers: [event loop delay, heap, GC, CPU, memory leak, runtime diagnostics]
  - name: node-release-engineering
    category: release
    triggers: [release, deployment, canary, artifact promotion, rollback, feature flag]

  - name: node-configuration
    category: runtime
    triggers: [configuration, environment variables, config validation, startup settings, precedence]
  - name: node-secrets
    category: security
    triggers: [secrets, credentials, token rotation, secret manager, redaction]
  - name: node-security-hardening
    category: security
    triggers: [SSRF, prototype pollution, unsafe deserialization, child process, runtime hardening]
  - name: node-supply-chain
    category: security
    triggers: [npm dependency, lockfile, provenance, install scripts, package audit, supply chain]
  - name: node-package-tooling
    category: tooling
    triggers: [package.json, exports, engines, workspaces, npm scripts, publishing]
  - name: node-build-engineering
    category: build
    triggers: [TypeScript build, project references, bundler, source maps, build cache, artifacts]
  - name: node-contract-testing
