name: Validate

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --version
      - run: npm --version
      - name: Lint check (structural)
        run: npm run validate
      - name: Test suite
        run: npm test
      - name: Pack export smoke test
        run: npm run pack:export
      - name: Skill loader smoke test
        run: |
          node bin/skills.mjs route "add a Postgres transaction with an index" --repo .
          node bin/skills.mjs list --category persistence
          node bin/skills.mjs show node-architecture
      - name: MCP server smoke test
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_skills","arguments":{"category":"ai"}}}' \
            | node lib/mcp-server.mjs
      - name: Verify exported pack manifest
        run: |
          test -f dist/node-agent-skills/pack-manifest.json
          test -f dist/node-agent-skills/checksums.sha256
          node -e "const m=require('./dist/node-agent-skills/pack-manifest.json');console.log('skills:',m.skills,'adapters:',m.adapters,'files:',m.files.length)"
      - name: Fixture repo adapter detection smoke test
        run: |
          # The skill loader should detect all declared adapters in the fixture's package.json.
          DETECTED=$(node bin/skills.mjs detect-repo examples/ecommerce-api | python3 -c "import json,sys; d=json.load(sys.stdin); print(','.join(sorted(a['name'] for a in d)))")
          for required in bullmq fastify ioredis pg pino zod; do
            echo "checking adapter: $required"
            echo "$DETECTED" | grep -q "\b$required\b" || (echo "missing $required in detected adapters: $DETECTED" && exit 1)
          done
          echo "all required adapters detected: $DETECTED"
      - name: Fixture repo route prompt smoke test
        run: |
          # A "transactional outbox" prompt routed against the fixture should land on
          # the transactional-outbox or postgresql-persistence primary.
          PRIMARY=$(node bin/skills.mjs route "add a transactional outbox for order creation" --repo examples/ecommerce-api | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['primary'])")
          echo "primary: $PRIMARY"
          test "$PRIMARY" = "node-transactional-outbox" || test "$PRIMARY" = "node-postgresql-persistence"
