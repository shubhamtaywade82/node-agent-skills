name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# One Release run per main commit; a superseded run (push landed mid-run)
# is cancelled instead of racing it — two changesets/action runs against
# the same Release PR would otherwise race on the version commit.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The changesets step includes `npm ci` and the full validate+test gate;
    # a hung step must fail loudly (and rerunnable) rather than stall for 6h.
    timeout-minutes: 30
    if: github.repository == 'shubhamtaywade82/node-agent-skills'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Validate before release
        run: |
          npm run validate
          npm test
      - name: Create or consume Release PR
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
          commit: "chore(release): version skills and pack"
          title: "chore(release): version skills and pack"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Cut the immutable v-tag + GitHub Release exactly when a release lands.
      # Gate: only the squash-merged Release PR commit carries this headline,
      # so feature/infra merges (same version, untagged) never get tagged at
      # the wrong tree. Idempotent: an existing tag short-circuits.
      # Anchor: everything reads and tags $GITHUB_SHA (the pushed commit),
      # NEVER the local HEAD — the changesets action leaves the checkout on
      # the release branch after it updates the Release PR, and tagging HEAD
      # would anchor the tag to a commit not on main (observed in run #21).
      - name: Tag immutable release
        run: |
          HEADLINE=$(git log -1 --pretty=%s "$GITHUB_SHA")
          case "$HEADLINE" in
            "chore(release): version skills and pack"*) ;;
            *) echo "not a release commit ($HEADLINE); skipping tag"; exit 0 ;;
          esac
          VERSION=$(git show "$GITHUB_SHA":package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} already tagged; skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "node-agent-skills v${VERSION}" "$GITHUB_SHA"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" --title "node-agent-skills v${VERSION}" --generate-notes --verify-tag --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Summary
        if: always()
        run: |
          echo "### Release outcome" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.changesets.outputs.published }}" ]; then
            echo "Published: ${{ steps.changesets.outputs.published }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "No release published; Release PR created or already up to date." >> $GITHUB_STEP_SUMMARY
          fi
