name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# One Release run per main commit; a superseded run (push landed mid-run)
# is cancelled instead of racing it — two changesets/action runs against
# the same Release PR would otherwise race on the version commit.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The changesets step includes `npm ci` and the full validate+test gate;
    # a hung step must fail loudly (and rerunnable) rather than stall for 6h.
    timeout-minutes: 30
    if: github.repository == 'shubhamtaywade82/node-agent-skills'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Validate before release
        run: |
          npm run validate
          npm test
      - name: Create or consume Release PR
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
          commit: "chore(release): version skills and pack"
          title: "chore(release): version skills and pack"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Summary
        if: always()
        run: |
          echo "### Release outcome" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.changesets.outputs.published }}" ]; then
            echo "Published: ${{ steps.changesets.outputs.published }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "No release published; Release PR created or already up to date." >> $GITHUB_STEP_SUMMARY
          fi
