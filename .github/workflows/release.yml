name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'shubhamtaywade82/node-agent-skills'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install -g @changesets/cli@latest
      - name: Validate before release
        run: |
          npm run validate
          npm test
      - name: Create or consume Release PR
        id: changesets
        uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          publish: npx changeset publish
          commit: "chore(release): version skills and pack"
          title: "chore(release): version skills and pack"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Summary
        if: always()
        run: |
          echo "### Release outcome" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.changesets.outputs.published }}" ]; then
            echo "Published: ${{ steps.changesets.outputs.published }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "No release published; Release PR created or already up to date." >> $GITHUB_STEP_SUMMARY
          fi
